<footer id="footer" class="border-t border-[var(--color-border)] bg-[var(--color-surface)]">
    <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">

        <div class="grid gap-10 sm:grid-cols-2 lg:grid-cols-4">

            <!-- Business Information -->
            <div>
                <a href="#top" class="text-xl font-bold tracking-tight text-[var(--color-text)]" data-footer-site-name>
                    Business Name
                </a>

                <p class="mt-4 max-w-xs text-sm leading-7 text-[var(--color-text-muted)]" data-footer-description>
                    Your business description goes here.
                </p>
            </div>

            <!-- Quick Links -->
            <div>
                <h2 class="text-sm font-semibold text-[var(--color-text)]">
                    Quick Links
                </h2>

                <nav class="mt-4 flex flex-col items-start gap-3 text-sm text-[var(--color-text-muted)]"
                    aria-label="Footer navigation" data-footer-navigation>
                    <!-- Navigation links are generated by JavaScript. -->
                </nav>
            </div>

            <!-- Contact Information -->
            <div>
                <h2 class="text-sm font-semibold text-[var(--color-text)]">
                    Contact
                </h2>

                <div class="mt-4 flex flex-col items-start gap-3 text-sm text-[var(--color-text-muted)]"
                    data-footer-contact>
                    <!-- Contact details are generated by JavaScript. -->
                </div>
            </div>

            <!-- Social Links -->
            <div>
                <h2 class="text-sm font-semibold text-[var(--color-text)]">
                    Follow Us
                </h2>

                <div class="mt-4 flex flex-wrap gap-3" data-footer-social>
                    <!-- Social links are generated by JavaScript. -->
                </div>
            </div>

        </div>

        <!-- Copyright and Developer Credit -->
        <div
            class="mt-10 flex flex-col gap-4 border-t border-[var(--color-border)] pt-6 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-xs text-[var(--color-text-muted)]" data-footer-copyright>
                © All rights reserved.
            </p>

            <p class="text-xs text-[var(--color-text-muted)]">
                Website by
                <a href="https://ep-webcraft.vercel.app/" target="_blank" rel="noopener noreferrer"
                    class="font-medium transition-colors hover:text-[var(--color-primary)]">
                    EP Webcraft
                </a>
            </p>
        </div>

    </div>
</footer>
