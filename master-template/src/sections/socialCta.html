<!-- =====================================================
     EP WEBCRAFT — SOCIAL CTA SECTION
     ===================================================== -->

<section id="social-cta"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-background)] py-14 sm:py-16"
    aria-labelledby="social-cta-title">
    <div class="mx-auto max-w-5xl px-4 text-center sm:px-6 lg:px-8">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
            data-social-cta-eyebrow>
            Stay Connected
        </p>

        <h2 id="social-cta-title" class="text-2xl font-bold tracking-tight text-[var(--color-text)] sm:text-3xl"
            data-social-cta-title>
            Follow Us on Social Media
        </h2>

        <p class="mx-auto mt-4 max-w-xl text-sm leading-7 text-[var(--color-text-muted)] sm:text-base"
            data-social-cta-description>
            Follow our pages for updates, new products, and announcements.
        </p>

        <div class="mt-7 flex flex-wrap items-center justify-center gap-3" data-social-cta-links>
            <!-- Social links are generated by JavaScript. -->
        </div>
    </div>
</section>
