<!-- =====================================================
     EP WEBCRAFT — SOCIAL PROOF SECTION
     ===================================================== -->

<section id="social-proof"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-background)] py-16 sm:py-20"
    aria-labelledby="social-proof-title">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-social-proof-eyebrow>
                Trusted Connections
            </p>

            <h2 id="social-proof-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl">
                <span data-social-proof-title-main>Built on Trust,</span>
                <span class="text-[var(--color-primary)]" data-social-proof-title-highlight>Backed by Quality.</span>
            </h2>

            <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-[var(--color-text-muted)]"
                data-social-proof-description>
                We value the partnerships and standards that help us serve our customers.
            </p>
        </div>

        <div class="mt-10 grid grid-cols-2 gap-4 sm:mt-12 sm:grid-cols-3 lg:grid-cols-4" data-social-proof-grid>
            <!-- Trust indicator cards are generated by JavaScript. -->
        </div>
    </div>
</section>
