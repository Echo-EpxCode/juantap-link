<!-- =====================================================
     EP WEBCRAFT — PRODUCTS SECTION
     ===================================================== -->

<section id="products"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-20 sm:py-24 lg:py-28">
    <!-- Ambient decoration -->
    <div class="pointer-events-none absolute -right-32 top-20 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="pointer-events-none absolute -left-32 bottom-20 h-64 w-64 rounded-full bg-[var(--color-glow)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <!-- Section heading -->
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-products-eyebrow>
                Our Products
            </p>

            <h2 class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl lg:text-5xl">
                <span data-products-title-main>
                    Made
                </span>

                <span class="text-[var(--color-primary)]" data-products-title-highlight>
                    For You.
                </span>
            </h2>

            <p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-[var(--color-text-muted)] sm:text-lg"
                data-products-description>
                Explore our featured products and discover something
                you'll love.
            </p>
        </div>

        <!-- Product cards -->
        <div class="mt-14 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" data-products-grid>
            <!-- Generated by JavaScript -->
        </div>
    </div>
</section>
