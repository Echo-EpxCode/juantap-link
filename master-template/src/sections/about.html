<!-- =====================================================
     EP WEBCRAFT — ABOUT SECTION
     ===================================================== -->

<section id="about"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-background)] py-20 sm:py-24 lg:py-28">
    <!-- Ambient decoration -->
    <div class="pointer-events-none absolute -left-32 top-20 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="pointer-events-none absolute -right-32 bottom-20 h-64 w-64 rounded-full bg-[var(--color-glow)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <!-- Section heading -->
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-about-eyebrow>
                About Us
            </p>

            <h2 class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl lg:text-5xl">
                <span data-about-title-main>
                    Built Around
                </span>

                <span class="text-[var(--color-primary)]" data-about-title-highlight>
                    Your Experience.
                </span>
            </h2>

            <p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-[var(--color-text-muted)] sm:text-lg"
                data-about-description>
                A short description about the business, its story,
                and what makes it different.
            </p>
        </div>

        <!-- Content -->
        <div class="mt-14 grid items-center gap-10 lg:grid-cols-2 lg:gap-16">
            <!-- Left content -->
            <div>
                <div class="grid gap-4 sm:grid-cols-2" data-about-highlights>
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <!-- Right information card -->
            <div class="relative">
                <div
                    class="relative overflow-hidden rounded-[var(--radius-xl)] border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-[var(--shadow-lg)] sm:p-8">
                    <!-- Decorative icon -->
                    <div
                        class="mb-6 flex h-14 w-14 items-center justify-center rounded-[var(--radius-lg)] bg-[var(--color-primary)]/10 text-[var(--color-primary)]">
                        <i class="bi bi-stars text-2xl" aria-hidden="true" data-about-card-icon></i>
                    </div>

                    <p class="text-sm font-semibold uppercase tracking-[0.15em] text-[var(--color-primary)]"
                        data-about-card-label>
                        Our Approach
                    </p>

                    <h3 class="mt-3 text-2xl font-bold tracking-tight text-[var(--color-text)] sm:text-3xl"
                        data-about-card-title>
                        Made With Purpose
                    </h3>

                    <p class="mt-4 text-base leading-7 text-[var(--color-text-muted)]" data-about-card-description>
                        Everything we do is designed around quality,
                        consistency, and customer experience.
                    </p>

                    <!-- Accent line -->
                    <div class="mt-8 h-1 w-16 rounded-full bg-[var(--color-primary)]" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </div>
</section>
