<!-- =====================================================
     EP WEBCRAFT — REVIEWS SECTION
     ===================================================== -->

<section id="reviews"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-background)] py-16 sm:py-20"
    aria-labelledby="reviews-title">
    <div class="pointer-events-none absolute -left-32 top-0 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-reviews-eyebrow>
                Share Your Experience
            </p>

            <h2 id="reviews-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl">
                <span data-reviews-title-main>Your Feedback</span>
                <span class="text-[var(--color-primary)]" data-reviews-title-highlight>Matters.</span>
            </h2>

            <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-[var(--color-text-muted)]"
                data-reviews-description>
                Had a great experience? Share your feedback on our review platforms.
            </p>
        </div>

        <div class="mx-auto mt-10 grid max-w-4xl grid-cols-1 gap-5 sm:mt-12 sm:grid-cols-2" data-reviews-grid>
            <!-- Review platform cards are generated by JavaScript. -->
        </div>
    </div>
</section>
