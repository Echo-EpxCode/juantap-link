<!-- =====================================================
     EP WEBCRAFT — VIDEO SECTION
     ===================================================== -->

<section id="video"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-background)] py-16 sm:py-20"
    aria-labelledby="video-title">
    <div class="pointer-events-none absolute -left-32 top-10 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-video-eyebrow>
                Watch Our Story
            </p>

            <h2 id="video-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl">
                <span data-video-title-main>See What Makes Us</span>
                <span class="text-[var(--color-primary)]" data-video-title-highlight>Special.</span>
            </h2>

            <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-[var(--color-text-muted)]" data-video-description>
                Discover our story, products, and the people behind our business.
            </p>
        </div>

        <div class="mx-auto mt-10 max-w-4xl sm:mt-12">
            <div
                class="overflow-hidden rounded-[var(--radius-xl)] border border-[var(--color-border)] bg-[var(--color-surface)] shadow-[var(--shadow-lg)]">
                <div class="aspect-video w-full bg-[var(--color-surface-soft)]" data-video-container>
                    <!-- Video embed is generated by JavaScript. -->
                </div>

                <div class="p-5 sm:p-6">
                    <h3 class="text-lg font-semibold text-[var(--color-text)]" data-video-caption>
                        A Closer Look at Our Business
                    </h3>

                    <p class="mt-2 text-sm leading-6 text-[var(--color-text-muted)]" data-video-caption-description>
                        Get to know what we do and what we offer.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
