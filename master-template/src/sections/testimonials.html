<!-- =====================================================
     EP WEBCRAFT — TESTIMONIALS SECTION
     ===================================================== -->

<section id="testimonials"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-16 sm:py-20"
    aria-labelledby="testimonials-title">
    <div class="pointer-events-none absolute -right-32 top-0 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-testimonials-eyebrow>
                Customer Feedback
            </p>

            <h2 id="testimonials-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl">
                <span data-testimonials-title-main>Words from Our</span>
                <span class="text-[var(--color-primary)]" data-testimonials-title-highlight>Customers.</span>
            </h2>

            <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-[var(--color-text-muted)]"
                data-testimonials-description>
                See what customers say about their experience with us.
            </p>
        </div>

        <div class="mt-10 grid grid-cols-1 gap-5 sm:mt-12 sm:grid-cols-2 lg:grid-cols-3" data-testimonials-grid>
            <!-- Testimonial cards are generated by JavaScript. -->
        </div>
    </div>
</section>
