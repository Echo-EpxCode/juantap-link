<!-- =====================================================
     EP WEBCRAFT — CTA SECTION
     ===================================================== -->

<section id="cta"
    class="relative isolate overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-16 sm:py-20"
    aria-labelledby="cta-title">
    <div class="pointer-events-none absolute -left-24 -top-24 -z-10 h-72 w-72 rounded-full bg-[var(--color-primary)]/10 blur-3xl"
        aria-hidden="true"></div>

    <div class="pointer-events-none absolute -bottom-24 -right-24 -z-10 h-72 w-72 rounded-full bg-[var(--color-primary)]/10 blur-3xl"
        aria-hidden="true"></div>

    <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
        <div
            class="rounded-[var(--radius-xl)] border border-[var(--color-border)] bg-[var(--color-surface)] px-6 py-10 text-center shadow-[var(--shadow-lg)] sm:px-12 sm:py-14">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-cta-eyebrow>
                Let's Get Started
            </p>

            <h2 id="cta-title"
                class="mx-auto max-w-3xl text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl lg:text-5xl">
                <span data-cta-title-main>Ready to Take the</span>
                <span class="text-[var(--color-primary)]" data-cta-title-highlight>Next Step?</span>
            </h2>

            <p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-[var(--color-text-muted)] sm:text-lg"
                data-cta-description>
                Contact us today to learn more about what we offer.
            </p>

            <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row" data-cta-actions>
                <!-- CTA buttons are generated by JavaScript. -->
            </div>
        </div>
    </div>
</section>
