<!-- =====================================================
     EP WEBCRAFT — RATINGS SECTION
     ===================================================== -->

<section id="ratings"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-16 sm:py-20"
    aria-labelledby="ratings-title">
    <div class="pointer-events-none absolute -right-32 top-0 h-64 w-64 rounded-full bg-[var(--color-primary)]/5 blur-3xl"
        aria-hidden="true"></div>

    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-ratings-eyebrow>
                Trusted by Our Customers
            </p>

            <h2 id="ratings-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl">
                <span data-ratings-title-main>Our Reputation</span>
                <span class="text-[var(--color-primary)]" data-ratings-title-highlight>Speaks.</span>
            </h2>

            <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-[var(--color-text-muted)]"
                data-ratings-description>
                See how customers rate their experience with our business.
            </p>
        </div>

        <div class="mx-auto mt-10 grid max-w-4xl grid-cols-1 gap-5 sm:mt-12 sm:grid-cols-2" data-ratings-grid>
            <!-- Rating cards are generated by JavaScript. -->
        </div>
    </div>
</section>
