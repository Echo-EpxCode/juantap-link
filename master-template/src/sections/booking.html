<!-- =====================================================
     EP WEBCRAFT — BOOKING SECTION
     ===================================================== -->

<section id="booking"
    class="relative overflow-hidden border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-16 sm:py-20"
    aria-labelledby="booking-title">
    <div class="mx-auto max-w-4xl px-4 text-center sm:px-6 lg:px-8">

        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
            data-booking-eyebrow>
            Book With Us
        </p>

        <h2 id="booking-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl"
            data-booking-title>
            Ready to Get Started?
        </h2>

        <p class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-[var(--color-text-muted)] sm:text-base"
            data-booking-description>
            Schedule your appointment or contact us to discuss your needs.
        </p>

        <div class="mt-8 flex flex-wrap justify-center gap-3">
            <a href="#contact"
                class="inline-flex items-center justify-center gap-2 rounded-full bg-[var(--color-primary)] px-7 py-3 font-semibold text-white shadow-sm transition duration-300 hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[var(--color-primary)]"
                data-booking-button>
                Book Now
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </a>
        </div>

        <p class="mt-5 text-xs text-[var(--color-text-muted)]" data-booking-note>
            Contact us to confirm availability.
        </p>

    </div>
</section>
