<!-- =====================================================
     EP WEBCRAFT — CONTACT SECTION
     ===================================================== -->

<section id="contact" class="border-t border-[var(--color-border)] bg-[var(--color-surface-soft)] py-16 sm:py-20"
    aria-labelledby="contact-title">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">

        <div class="mx-auto max-w-2xl text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[var(--color-primary)]"
                data-contact-eyebrow>
                Get in Touch
            </p>

            <h2 id="contact-title" class="text-3xl font-bold tracking-tight text-[var(--color-text)] sm:text-4xl"
                data-contact-title>
                Contact Us
            </h2>

            <p class="mt-4 text-sm leading-7 text-[var(--color-text-muted)] sm:text-base" data-contact-description>
                Have a question? Use the contact details below to reach us.
            </p>
        </div>

        <div class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" data-contact-details>
            <!-- Contact cards are generated by JavaScript. -->
        </div>

    </div>
</section>
